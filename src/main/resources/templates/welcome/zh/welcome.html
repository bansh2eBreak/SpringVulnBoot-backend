<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>欢迎 - SpringVulnBoot SSTI Demo</title>
    <style>
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; padding: 30px; background: #f6f8fa; }
        .card { background: #fff; padding: 24px; border-radius: 8px; max-width: 720px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        h2 { color: #2c3e50; margin: 0 0 12px 0; }
        .badge { display: inline-block; padding: 2px 10px; background: #409EFF; color: #fff; border-radius: 10px; font-size: 12px; }
        code { background: #f0f2f5; padding: 2px 6px; border-radius: 3px; color: #d63384; }
    </style>
</head>
<body>
<div class="card">
    <h2>欢迎使用 SpringVulnBoot <span class="badge">中文</span></h2>
    <p>这是一个 Thymeleaf 渲染的服务端页面。</p>
    <p>当前语言参数：<code th:text="${lang}">zh</code></p>
    <hr>
    <p style="color:#909399;font-size:13px;">
        模板路径：<code>templates/welcome/zh/welcome.html</code><br>
        请通过 SSTI Payload 测试不同场景下的行为差异。
    </p>
</div>
</body>
</html>
