name: Build and Push Backend Image

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名称自动使用仓库所有者/springvulnboot-backend（全小写）
  IMAGE_NAME: ${{ github.repository_owner }}/springvulnboot-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # push 到 main/master 时打 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}
            # push tag（如 v1.2.3）时同时打版本标签
            type=ref,event=tag
            # 同时保留短 SHA 标签，方便追溯
            type=sha,prefix=sha-,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          # 同时构建 amd64 和 arm64，兼容 Apple Silicon 及 x86 服务器
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions Cache 加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
